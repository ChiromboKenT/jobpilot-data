headline: AI / LLM Engineer
summary: Software engineer with 8 years of experience, specializing in LLM applications, evaluation
  and model serving. Built a FastAPI inference gateway, evaluated RAG groundedness, benchmarked vLLM
  on AMD MI300X GPUs, and implemented claim-validation checks for LLM-generated CVs. Earlier developed
  and evaluated water-quality risk models using Python and repeatable AWS SageMaker workflows.
