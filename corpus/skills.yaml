# Aliases are how an advert's wording maps onto your skills: an ATS looking for
# "Postgres" or "RESTful APIs" matches because the alias is here. Keep aliases to
# real synonyms; never alias a skill you lack. Avoid aliases that are everyday
# words ("Next", "Auth"): the truth check treats them as skill mentions.
# Levels: "exposure" skills are kept out of headlines and summaries.
# Lines marked "# new" were added on 13 Nov 2026; check each level.
