cv:
  headline: Senior ML Engineer
  summary: Senior ML Engineer building and deploying production ML models, MLOps pipelines
    and GenAI applications with Python and SQL. At Dreamverse Holdings, wrapped LLM
    inference behind a FastAPI gateway with model versioning and request budgets,
    and built RAG workflows with performance monitoring. Earlier ran repeatable model
    experiments and CI/CD/CT workflows on AWS SageMaker.
  summary_claims:
