cv:
  headline: Senior ML Engineer
  summary: Machine Learning Engineer experienced in developing and deploying AI and
    ML models at scale, maintaining ML pipelines, and monitoring performance for real-time
    production workloads. Integrated large language models and ML algorithms into
    production systems to improve automation and decision-making. Implemented CI/CD/CT
    workflows for ML models on AWS SageMaker and worked on cloud architectures, containerization,
    deployment, and alerting.
