letter:
  paragraphs:
  - Your Senior ML Engineer role asks for someone to deploy and monitor machine learning
    models and ML pipelines in production, which matches my recent work. I developed
    and deployed AI and ML models to automate production workloads, added performance
    monitoring, and maintained ML pipelines for real-time applications.
  - When we needed reliable LLM model serving without runaway costs or malformed outputs,
    I wrapped the inference service behind a FastAPI gateway with model versioning,
    timeouts, request budgets, and structured response checks. Before swapping embedding
    models in our RAG setup, I built an evaluation set covering source relevance,
    groundedness, and negative test questions so we could verify behaviour before
    shipping changes.
  - For automated delivery and deployment, I used AWS SageMaker to run CI/CD and continuous
    testing workflows for machine learning models so updates could be tested repeatably.
    In another project, I containerised the Next.js and API components with Docker
    and defined promotion checks for the bank's on-premise runtime. That gave the
    team a clear path from build to release.
  - Sabenza IT & Recruitment is hiring in Johannesburg for an engineer who can take
    LLM, RAG, and machine learning systems into monitored production alongside cross-functional
    teams, and that end-to-end ownership is where I work best. Let me know if you
    would like to set up a call to talk through my experience.
  claim_ids:
  - dreamverse-holdings-1-01
  - dreamverse-mlops-01
  - dreamverse-mlops-03
  - university-of-johann-3-07
  - access-cloud-01
