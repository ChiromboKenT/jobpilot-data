  - RAG
  - Model serving
  - ML pipelines
  - LLM evaluation
  - FastAPI
  - Docker
  - Containerization
  - CI/CD
  - SQL
  - REST APIs
  - Microservices
  - Monitoring
  - Observability
  - AWS Sagemaker
  - Testing
