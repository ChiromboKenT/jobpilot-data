letter:
  paragraphs:
  - I am applying for the AI Engineer role at Nedbank, where your team is optimising
    end-to-end Collections and Recoveries workflows. That work connects directly to
    my experience writing account-allocation rules in a C# collections service. I
    have long believed Nedbank aligns with my vision to build impactful solutions
    that actually help people and change their lives, rather than only increasing
    convenience.
  - In that C# collections service, accounts needed reliable routing to follow-up
    queues. I wrote priority-based account-allocation rules with unit tests to keep
    routing consistent. More recently, I integrated LLM-backed workflows into Python
    and TypeScript services. To keep model behaviour predictable in production, I
    placed calls behind APIs using prompt engineering, scope checks, and error handling.
  - Evaluating model changes safely is just as important as shipping them. Before
    changing embedding models in a RAG system, I built an evaluation set covering
    source relevance, groundedness, and negative test questions. Elsewhere, I added
    audit records for application-state changes and document actions without writing
    sensitive values to logs, keeping traceability intact while protecting sensitive
    data.
  - Nedbank's focus on improving systems and processes while keeping outputs aligned
    with governance and legislation fits how I approach engineering. I would be glad
    to talk through these projects and how they map to your team's plans.
  claim_ids:
  - rp-alloc-01
  - dreamverse-ai-01
  - dreamverse-mlops-03
  - access-lead-03
