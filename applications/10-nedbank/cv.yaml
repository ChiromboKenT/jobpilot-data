letter:
  paragraphs:
  - I am applying for the AI Engineer role at Nedbank because its mission aligns with
    my goal of building work that genuinely helps people and changes their lives,
    rather than just adding convenience. Your team is looking to optimise the Collections
    and Recoveries unit with AI and automated workflows. That lines up with my work
    writing account-allocation rules in a C# .NET collections service to route customer
    accounts to follow-up queues by priority, backed by unit tests.
  - Human-in-the-loop AI systems are hard to trust without clear checks on what a
    model returns. I built RAG evaluation sets and repeatable LLM output checks alongside
    OpenTelemetry, Prometheus and Posthog observability, audit logging and analytics
    for those systems. I also integrated LLM-backed workflows into Python and TypeScript
    services, keeping model calls behind APIs with explicit prompts, scope checks
    and error handling.
  - In banking, automated form filling should not lock applicants into extraction
    mistakes. I prototyped document OCR that pre-filled banking applications while
    keeping every extracted field editable by the applicant. I also added audit records
    for application-state changes and document actions without writing sensitive values
    to logs.
  - Nedbank stands out for pairing AI adoption with clear governance, legislative
    alignment and end-to-end system design across its business units. I would be glad
    to talk through this work and how it fits what your team is building.
  claim_ids:
  - rp-alloc-01
  - dreamverse-holdings-1-g02
  - dreamverse-ai-01
  - access-aiml-01
  - access-lead-03
