  gaps:
  - Proven experience scaling a production product to 10,000+ users
  - SQLModel
  - Google Cloud Run, Cloud SQL, BigQuery and Pub/Sub
  - Daily use of AI coding tools
  - CRM, payment, outreach and invoicing integrations
  - Multimodal AI, email deliverability, SOC 2 readiness and creator-marketing experience
  - Hiring engineers
letter:
  paragraphs:
  - I am applying for the Lead Software Engineer role because I want to work on complex
    systems aimed to scale, exercise architectural design and benchmark different
    approaches against real requirements. Your team is turning an internal campaign-management
    platform into a product for campaign teams, creators and clients. At Dreamverse,
    I set the technical direction across projects while staying hands-on with Next.js,
    TypeScript, Python and PostgreSQL.
  - When we needed reliable LLM features, I wrapped our inference service behind a
    FastAPI gateway with model versioning, timeouts, request budgets and structured
    response checks. Later, to stop prompt changes from quietly driving up inference
    spend, I added per-request token and GPU cost reporting. That made the cost impact
    of prompt changes visible to product teams.
  - To keep standards consistent across our Python services, I built and published
    dreamverse-core to PyPI. It is a shared FastAPI package that gives Dreamverse
    services authentication, audit logging, idempotency, feature flags and observability.
  - I am drawn to this opportunity because the platform is already used internally
    and now needs someone to own architecture, production operations and team growth
    for the long term. I would be glad to discuss my experience and walk through these
    systems on a call.
  claim_ids:
  - dreamverse-founder-01
  - dreamverse-mlops-01
  - dreamverse-mlops-04
  - dv-core-01
