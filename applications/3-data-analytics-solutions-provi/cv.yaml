letter:
  paragraphs:
  - Your advert for a Full Stack Software Engineer asks for someone who can build
    backend applications and manage database structures and migrations. On a C# .NET
    customer service, I built account-status synchronisation with PostgreSQL migrations
    that replaced a legacy status column and kept a status history.
  - Integration and API design are central to the role. When a branch-integration
    event service was reading directly from the Customer and Deal databases, I moved
    it onto those services' REST APIs instead. On another project, I designed Python
    FastAPI and Node.js RESTful APIs to handle partner profiles, document uploads,
    search and administration.
  - On the frontend and security side, I built loan-application screens in React for
    a retail-credit lender's online portal, covering contact details, bank-account
    checks, document upload and the loan summary. I also closed an account-enumeration
    gap in password reset and added a file-type allowlist and count checks to document
    uploads.
  - Building web and enterprise systems onsite in Johannesburg for a Data & Analytics
    Solutions provider fits the mix of frontend, API and database work I have focused
    on. I would be glad to talk through my work with your team.
  claim_ids:
  - rp-account-01
  - rp-api-01
  - dreamverse-leadfull-02
  - rp-loans-01
  - rp-sec-01
