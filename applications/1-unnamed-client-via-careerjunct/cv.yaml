  gaps:
  - Bachelor's degree in Computer Science, Engineering, Software Engineering, Applied
    Mathematics, Statistics or related field
  - Master's or PhD in AI, Machine Learning or related field
  - AWS certifications
  - AWS Bedrock and Bedrock AgentCore
  - Deploying solutions into an AI marketplace environment
  - Intelligent agents
letter:
  paragraphs:
  - I am applying for the Machine Learning Engineer role. Your team needs someone
    to design, build, deploy, and maintain production machine learning models and
    automation tools. That matches my recent work developing and deploying AI and
    ML models to automate production workloads, where I also maintained real-time
    ML pipelines with performance monitoring.
  - When serving large language models, inference workflows need clear limits and
    predictable outputs. I wrapped an LLM inference service behind a FastAPI gateway
    and added model versioning, timeouts, request budgets, and structured response
    checks.
  - On the cloud and data side, I used Python, SQL, and AWS SageMaker to organise
    data analysis and run repeatable model experiments. I also used AWS SageMaker
    to run continuous integration, delivery, and testing workflows for machine learning
    models. Outside of model training, I maintained AWS Lambda, DynamoDB, and S3 integrations
    used by streaming-metadata and campaign services.
  - Working remotely in South Africa on production machine learning, automation tools,
    and an AI marketplace environment is the kind of engineering work I want to focus
    on. Happy to talk through my experience or share more detail if you would like
    to set up a call.
  claim_ids:
  - dreamverse-holdings-1-01
  - dreamverse-mlops-01
  - uj-research-06
  - university-of-johann-3-07
  - dazn-cloud-06
