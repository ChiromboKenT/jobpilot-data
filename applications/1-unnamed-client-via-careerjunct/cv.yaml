cv:
  headline: Machine Learning Engineer
  summary: Machine Learning Engineer building and deploying production ML models,
    MLOps pipelines and AI applications in Python. Built a FastAPI LLM inference gateway
    with model versioning and a RAG evaluation set at Dreamverse Holdings. Earlier
    ran repeatable model experiments and CI/CD/CT workflows with Python, SQL and AWS
    SageMaker at UJ PEETS.
  summary_claims:
  - dreamverse-holdings-1-01
  - dreamverse-mlops-01
  - dreamverse-mlops-03
  - uj-research-06
  - university-of-johann-3-07
  skills:
  - Python
  - Machine Learning
  - SQL
  - AWS
  - ML pipelines
  - Model serving
  - AWS Sagemaker
  - LLMs
  - RAG
  - LLM evaluation
  - FastAPI
  - CI/CD
  - Docker
  - PostgreSQL
  - AWS Lambda
  - AWS S3
  - Monitoring
  - Data pipelines
  roles:
  - role_id: redpanda
    bullets:
    - claim_id: rp-account-01
      text: Built account-status synchronisation in a C# .NET customer service with
        PostgreSQL migrations that replaced a legacy status column and kept a status
        history.
    - claim_id: rp-java-01
      text: Developed a Java Spring Boot ticket service backed by AWS DynamoDB for
        a retail group's client project.
    - claim_id: rp-api-01
      text: Moved a branch-integration event service off direct reads of the Customer
        and Deal databases onto those services' APIs.
    - claim_id: rp-alloc-01
      text: Wrote account-allocation rules with unit tests in a C# collections service
        to route customer accounts to follow-up queues by priority.
    - claim_id: rp-ops-01
      text: Maintained QA, UAT and production configuration for services on Docker
        Swarm, including switching the mail provider from Mailgun to SMTP.
    - claim_id: rp-sec-01
      text: Closed an account-enumeration gap in password reset and added a file-type
        allowlist and count checks to document uploads.
  - role_id: dreamverse-holdings-1
    bullets:
    - claim_id: dreamverse-holdings-1-01
      text: Developed and deployed AI and ML models that automate production workloads,
        with performance monitoring and MLOps pipelines for real-time applications.
    - claim_id: dreamverse-mlops-01
      text: Wrapped an LLM inference service behind a FastAPI gateway with model versioning,
        timeouts, request budgets and structured response checks.
    - claim_id: dreamverse-mlops-03
      text: Built a RAG evaluation set covering source relevance, groundedness and
        negative test questions before changing embedding models.
    - claim_id: dreamverse-holdings-1-02
      text: Integrated LLMs and ML algorithms into client production systems, tuning
        them for real-time use to automate decisions.
    - claim_id: dreamverse-mlops-02
      text: Benchmarked vLLM throughput on AMD MI300X GPUs to choose quantization
        and batching settings within a fixed budget.
    - claim_id: dv-jobpilot-02
      text: Wrote Python code checks that compare every LLM-tailored CV bullet with
        a corpus of recorded claims so generated CVs cannot add skills, numbers or
        employers not on record.
  - role_id: access-bank
    bullets:
    - claim_id: access-aiml-01
      text: Prototyped document OCR that pre-filled banking applications while keeping
        every extracted field editable by the applicant.
    - claim_id: access-swe2-03
      text: Connected form submission to Next.js server routes backed by Prisma and
        PostgreSQL.
  - role_id: dazn
    bullets:
    - claim_id: dazn-cloud-06
      text: Maintained the AWS Lambda, DynamoDB and S3 integrations used by streaming-metadata
        and campaign services.
    - claim_id: dazn-platform-06
      text: Introduced OpenTelemetry tracing and p95 latency dashboards for campaign
        microservices.
  - role_id: league-digital
    bullets:
    - claim_id: league-05
      text: Monitored automated builds and fixed failing releases before they reached
        the client.
    - claim_id: league-01
      text: Built and maintained features for the MyDStv mobile app in React Native,
        writing shared code for Android and iOS.
  - role_id: university-of-johann-3
    bullets:
    - claim_id: university-of-johann-3-07
      text: Used AWS SageMaker to run continuous integration, delivery and testing
        (CI/CD/CT) workflows for machine learning models.
    - claim_id: uj-research-06
      text: Organised data analysis and repeatable model experiments using Python,
        SQL and AWS SageMaker.
  - role_id: vincii
    bullets:
    - claim_id: vincii-react-01
      text: Built and maintained features for a retailer-facing CMS dashboard in React
        and TypeScript.
    - claim_id: vincii-react-03
      text: Profiled React components to find unnecessary re-renders and expensive
