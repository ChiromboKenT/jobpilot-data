portal_url: https://myjobs.dream2host.shop

search:
  # A job passes if its location is empty or contains one of these (case-insensitive).
  locations: [Johannesburg, Sandton, Pretoria, Centurion, Midrand, Gauteng, Remote, Home Based, South Africa]
  # A job is filtered out if its title contains one of these as a whole word.
  exclude_words: [Junior, Intern, Internship, Graduate, Sales]
  shortlist_score: 70        # Today shows jobs at or above this
  shortlist_max: 10          # and at most this many
  # source name -> sender addresses. An entry starting with @ matches the whole domain.
  # Fill from `python -m jobpilot doctor`, which lists the senders found in your mailbox.
  alert_senders:
    linkedin: [jobalerts-noreply@linkedin.com]
    indeed: [donotreply@jobalert.indeed.com, donotreply@match.indeed.com]
    pnet: [info@jobalerts.pnet.co.za]
    careerjunction: []
    careers24: []
    offerzen: []
  adzuna:
    country: za
    searches:
      - {what: "developer", where: Johannesburg}
  # Remote job boards, read once in the daily run from the feeds the boards publish.
  remote:
    boards: [remotive, himalayas, wwr]
    keywords: [".NET", "C#", "Python", "Backend", "Full Stack", "Software Engineer","Developer","Data Engineer" ]
    regions: [Worldwide, Anywhere, Africa, South Africa, EMEA]
  # Pay moves a job up the shortlist by at most `boost` points; target is a year's pay in `currency`.
  salary:
    currency: ZAR
    rates: {USD: 17.0, EUR: 19.5, GBP: 22.5}
    target: 840000     # R70,000 a month
    boost: 10

models:
  # LiteLLM model names. fallback is tried when the model fails twice. null = none.
  # reasoning: LiteLLM reasoning_effort (none|minimal|low|medium|high), used for both models.
  # Leave it out and Gemini thinks at its default "high": slower and dearer.
  # fast = repetitive work (extract, score, analyse, classify, follow-up). strong = tailor, letter, import.
  fast:   {model: gemini/gemini-3.8-flash, fallback: gemini/gemini-3.5-flash-lite,  reasoning: medium}
  strong: {model: gemini/gemini-4-hydrogen, fallback: gemini/gemini-3.8-flash,      reasoning: medium}

mail:
  lookback_days: 3           # each run reads this many days, so a missed run is caught up
  review_below: 0.7          # classifications under this confidence wait for you

followup:                    # defaults copied onto each new application
  enabled: true              # not "on": YAML reads a bare `on` key as the boolean true
  days: 7
  max: 2
  mode: draft                # draft | auto
  no_response_days: 21

docs:
  cv_template: cv_tawanda_template.docx
  letter_template: letter.docx
  max_pages: 4
  max_bullets_recent: 6      # per role, first two roles
  max_bullets_older: 2       # per role, the rest
  banned_phrases:
    - results-driven
    - passionate
    - proven track record
    - team player
    - dynamic
    - leverage
    - spearhead
    - synerg
    - detail-oriented
    - fast-paced
    - utilis
    - utiliz
    - seamless
    - robust
    - cutting-edge
    - innovative
    - delve
    - tapestry
    - showcase
    - harness
    - testament to
    - pivotal
    - meticulous
    - world-class
    - best-in-class
    - game-changer
    - ever-evolving
    - in today's
    - wealth of experience
    - hit the ground running
    - self-starter
    - go-getter
    - add value
    - i am writing to
    - i am excited
    - i am thrilled
    - hope this email finds you well
    - —
  email_subject: "Application: {title}"
  email_body: |
    Dear Hiring Manager,

    Please find my CV attached for the {title} position at {company}.

    Kind regards,
    {name}
    {phone}
